name: Foundation checks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netsentry
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: netsentry_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netsentry -d netsentry_phase1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://netsentry:isolated-test-password@127.0.0.1:5432/netsentry_phase1_test
      TEST_DATABASE_SSL: 'false'
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build the development agent for live API checks
        env:
          GOTOOLCHAIN: local
        run: |
          mkdir -p artifacts
          cd agent
          go build -o ../artifacts/netsentry-agent ./cmd/netsentry-agent
          echo "TEST_AGENT_BINARY=$GITHUB_WORKSPACE/artifacts/netsentry-agent" >> "$GITHUB_ENV"
          go test -c -o ../artifacts/network-runner-test ./internal/runner
          echo "TEST_NETWORK_RUNNER_BINARY=$GITHUB_WORKSPACE/artifacts/network-runner-test" >> "$GITHUB_ENV"
      - name: Prepare contracts and backend dependencies without install scripts
        run: |
          npm --prefix contracts ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend ci --ignore-scripts --no-audit --no-fund
      - name: Check shared contracts and backend
        run: |
          npm run check:scaffolds
          npm run check:release
          npm run test:release
          npm run check:infra
          npm run test:infra
          npm run check:contracts
          npm run test:contracts
          npm run build:backend
          npm run test:backend
      - name: Verify database lifecycle and actual API responses
        run: |
          node backend/scripts/check-database.mjs
          node backend/scripts/check-api.mjs
      - name: Verify encrypted PostgreSQL backup and empty-target recovery
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run test:recovery

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build the development agent for desktop IPC checks
        env:
          GOTOOLCHAIN: local
        run: |
          mkdir -p artifacts
          cd agent
          go build -o ../artifacts/netsentry-agent ./cmd/netsentry-agent
          echo "TEST_AGENT_BINARY=$GITHUB_WORKSPACE/artifacts/netsentry-agent" >> "$GITHUB_ENV"
      - name: Build desktop source without downloading Electron runtime
        run: |
          npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
          npm run build:desktop
          npm run test:desktop-agent
          npm run test:infra

  agent:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Check Go source and capability output
        env:
          GOTOOLCHAIN: local
        run: |
          npm --prefix contracts ci --ignore-scripts --no-audit --no-fund
          mkdir -p artifacts
          cd agent
          gofmt -d .
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build -o ../artifacts/netsentry-agent ./cmd/netsentry-agent
          ../artifacts/netsentry-agent > ../artifacts/agent-report.json
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o ../artifacts/agent-windows.exe ./cmd/netsentry-agent
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o ../artifacts/agent-macos-no-keychain ./cmd/netsentry-agent
          cd ..
          node contracts/scripts/check-agent-report.mjs artifacts/agent-report.json
          npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
          npm run build:desktop
          TEST_AGENT_BINARY="$GITHUB_WORKSPACE/artifacts/netsentry-agent" npm --prefix desktop run test:developer

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netsentry
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: netsentry_phase4_web_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netsentry -d netsentry_phase4_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://netsentry:isolated-test-password@127.0.0.1:5432/netsentry_phase4_web_test
      TEST_DATABASE_SSL: 'false'
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Prepare web and fixture-backend dependencies without install scripts
        run: |
          npm --prefix contracts ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend ci --ignore-scripts --no-audit --no-fund
          npm --prefix dashboard ci --ignore-scripts --no-audit --no-fund
      - name: Build and lint the dashboard and fixture backend
        run: |
          npm run build:backend
          npm --prefix dashboard run lint
          npm --prefix dashboard run build
      - name: Prepare the desktop Chromium test browser
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Exercise browser flows against isolated PostgreSQL
        run: npm --prefix dashboard run test:e2e
      - name: Verify desktop appearance in the existing Chromium browser
        run: |
          npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
          npm run build:desktop
          npm run test:desktop-appearance
      - name: Keep failure screenshots and traces from synthetic browser fixtures
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dashboard-browser-failures
          path: dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android-core:
    # Standalone JVM source/contracts/API checks only. No Gradle, Android SDK or emulator setup.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netsentry
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: netsentry_android_jvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netsentry -d netsentry_android_jvm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://netsentry:isolated-test-password@127.0.0.1:5432/netsentry_android_jvm_test
      TEST_DATABASE_SSL: 'false'
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare checksum-pinned standalone Kotlin and JSON tooling
        run: |
          mkdir -p "$RUNNER_TEMP/android-jvm-tools"
          cd "$RUNNER_TEMP/android-jvm-tools"
          curl -fL --retry 2 -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          echo 'a118197b0de55ffab2bc8d5cd03a5e39033cfb53383d6931bc761dec0784891a  kotlin.zip' | sha256sum -c -
          unzip -q kotlin.zip
          curl -fL --retry 2 -o json.jar https://repo.maven.apache.org/maven2/org/json/json/20250107/json-20250107.jar
          echo '85d4c1ab192d3117fd02c7fff1ec0fe63ade45cf56def7fe950ef060cf06e99f  json.jar' | sha256sum -c -
          echo "KOTLINC=$RUNNER_TEMP/android-jvm-tools/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"
          echo "JSON_JAR=$RUNNER_TEMP/android-jvm-tools/json.jar" >> "$GITHUB_ENV"
          curl -fL --retry 2 -o okhttp.jar https://repo.maven.apache.org/maven2/com/squareup/okhttp3/okhttp/4.12.0/okhttp-4.12.0.jar
          echo 'b1050081b14bb7a3a7e55a4d3ef01b5dcfabc453b4573a4fc019767191d5f4e0  okhttp.jar' | sha256sum -c -
          curl -fL --retry 2 -o okio.jar https://repo.maven.apache.org/maven2/com/squareup/okio/okio-jvm/3.6.0/okio-jvm-3.6.0.jar
          echo '67543f0736fc422ae927ed0e504b98bc5e269fda0d3500579337cb713da28412  okio.jar' | sha256sum -c -
          echo "OKHTTP_JAR=$RUNNER_TEMP/android-jvm-tools/okhttp.jar" >> "$GITHUB_ENV"
          echo "OKIO_JAR=$RUNNER_TEMP/android-jvm-tools/okio.jar" >> "$GITHUB_ENV"
      - name: Prepare shared contracts and actual fixture backend
        run: |
          npm --prefix contracts ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend ci --ignore-scripts --no-audit --no-fund
          npm run build:backend
      - name: Check Kotlin core, all-source syntax and emitted contracts
        run: npm run test:android-core
      - name: Exercise Kotlin HTTPS adapters against isolated API and PostgreSQL
        run: node android/scripts/check-live.mjs

  ios-core:
    # Existing macOS host compiler only; no iOS build, SDK installation or simulator.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Prepare shared contract dependencies
        run: npm --prefix contracts ci --ignore-scripts --no-audit --no-fund
      - name: Parse Swift source and check extension boundaries
        run: npm run check:ios
      - name: Compile portable Swift repository and validate emitted contracts
        run: npm run test:ios-core
